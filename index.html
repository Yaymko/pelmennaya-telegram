<style>
/* Layout: one-screen game. Header strip, board of bamboo steamer stacks centered in the remaining space, thumb-reach toolbar at the bottom. Single committed look: steamy jade kitchen. */
:root{
  --bg:#163b38; --bg-hi:#21534e; --panel:#0f2d2a;
  --bamboo:#dcab62; --bamboo-hi:#efc988; --bamboo-dk:#9c6a2c; --basket-in:#4a2f17;
  --st:#dcab62; --st-hi:#efc988; --st-dk:#9c6a2c; --st-in:#4a2f17;
  --dough:#f7ecd9; --ink:#33200f; --text:#f5ead6; --muted:#9fc0b8;

  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(120% 70% at 50% 38%,var(--bg-hi) 0%,var(--bg) 62%);color:var(--text);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding-block:12px 4px}
.brand{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:.01em;color:var(--bamboo-hi)}
.titles{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0;text-align:left;color:inherit;font:inherit;padding:0}
.lv-ic{width:11px;height:11px;vertical-align:-1px;margin-left:5px;opacity:.85}
.lvls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.lv{background:var(--panel);border-radius:12px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text);font:inherit;font-weight:800;font-size:16px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.lv .ss{display:flex;gap:1px;color:var(--bamboo-dk)}.lv .ss svg{width:11px;height:11px}.lv .ss .on{color:#f3c24b}
.lv.cur{background:var(--chili);color:#fff8ee}.lv.cur .ss{color:#fff8ee}
.lv.locked{opacity:.35;pointer-events:none}
.lvl{font-family:var(--font-display);font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:normal;line-height:1.3}
@media(max-width:390px){.coins .plus{display:none}.lvl{letter-spacing:.05em!important}header{gap:8px!important}.tool{font-size:11px!important;letter-spacing:-.01em}}
@media(max-width:340px){.tool{font-size:10px!important;padding-inline:2px!important}}
.coins .plus{font-size:15px;line-height:1;color:var(--muted);margin-left:1px}
.coins{color:inherit;font:inherit;font-weight:800;display:flex;align-items:center;gap:6px;background:var(--panel);padding:5px 10px 5px 6px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a3,var(--coin) 55%,#b9861d);box-shadow:inset 0 0 0 1.5px #b9861d;display:inline-block;flex:none}

  background:repeating-linear-gradient(90deg,rgba(80,45,10,.22) 0 1.5px,transparent 1.5px 7px),linear-gradient(180deg,var(--st-hi),var(--st) 45%,var(--st-dk));
  box-shadow:inset 0 2px 0 rgba(255,240,200,.5),0 2px 0 rgba(0,0,0,.25)}

  background:repeating-linear-gradient(90deg,rgba(80,45,10,.2) 0 1.5px,transparent 1.5px 7px),linear-gradient(180deg,var(--st-hi),var(--st) 60%,var(--st-dk));
  box-shadow:inset 0 -3px 0 rgba(80,45,10,.35),0 3px 0 rgba(0,0,0,.25);display:none}
.lid::after{content:"";position:absolute;left:50%;top:-14%;width:22%;height:24%;translate:-50% 0;border-radius:6px 6px 3px 3px;background:var(--st-dk)}
.col.done .lid{display:block}
.col.done.just .lid{animation:lidDrop .42s cubic-bezier(.3,1.5,.5,1)}

.steam i:nth-child(1){left:14%;animation-delay:.1s}.steam i:nth-child(2){left:40%;animation-delay:.9s}.steam i:nth-child(3){left:64%;animation-delay:1.6s}

@keyframes pulse{50%{outline-color:transparent}}
.fly{position:fixed;z-index:50;pointer-events:none}
.fly svg{width:100%;height:100%;display:block;overflow:visible}

.bar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding-block:8px 14px}

const DP_L=[32,13,14,15,16,22,23];   // вс: скрытые, пн–чт: 8 начинок, пт–сб: одна пустая
function dpReady(){return S.level>=5&&(!S.dp||S.dp.last!==dayStr(new Date()))}
function dpStreak(){const y=new Date();y.setDate(y.getDate()-1);return S.dp&&S.dp.last===dayStr(y)?S.dp.streak+1:1}
function dpSeed(){const d=new Date();return (d.getFullYear()*372+d.getMonth()*31+d.getDate())*104729+7}

function curL(){return G.mode==='dp'?G.dpL:S.level}
function colorsFor(L){return Math.min(3+Math.floor((L-1)/2),8)}
const emptiesFor=L=>L>=20?1:2;        // с 20-го уровня одна пустая пароварка
const hiddenFor=L=>L>=30;             // с 30-го видно только верхний пельмень
function genLevel(L,seed0){
  const k=colorsFor(L);let seed=seed0||L*7919+13;
  for(let tries=0;tries<400;tries++){
    const r=mulberry32(seed++);
    const pal=[0,1,2,3,4,5,6,7];for(let i=pal.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pal[i],pal[j]]=[pal[j],pal[i]]}
    const items=[];for(let i=0;i<k;i++)for(let j=0;j<CAP;j++)items.push(pal[i]);
    for(let i=items.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
    const cols=[];for(let i=0;i<k;i++)cols.push(items.slice(i*CAP,i*CAP+CAP));
    for(let e=0;e<emptiesFor(L);e++)cols.push([]);
    if(cols.some(c=>c.length&&isDone(c)))continue;
    if(cols.some(c=>c.length&&runLen(c)>=3))continue;
    const path=solve(cols,40000);
    if(path){genLevel.par=path.length;return cols}
  }
  return null;
}

let ac=null,noiseBuf=null;
function ensureAC(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){ac=null}}
  if(ac&&ac.state==='suspended'&&!paused)ac.resume();
}
function tone(f,dur,type,gain,f2,delay){
  if(!ac||S.muted)return;const t=ac.currentTime+(delay||0);
  const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain||.2,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,gain,ftype,f1,f2,delay,q){
  if(!ac||S.muted)return;const t=ac.currentTime+(delay||0);
  const src=ac.createBufferSource();src.buffer=noiseBuf;const fl=ac.createBiquadFilter();fl.type=ftype;fl.Q.value=q||1;
  fl.frequency.setValueAtTime(f1,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(fl).connect(g).connect(ac.destination);src.start(t);src.stop(t+dur+.05);
}

function layout(){

  const gx=12,gy=18;let best={cw:0,per:n};
  for(let per=n;per>=1;per--){

    const cw=Math.min(byW,byH,96);

  }
  const cw=Math.max(36,Math.floor(best.cw));

function move(a,b){
  G.busy=true;G.hint=null;
  G.hist.push(G.cols.map(c=>c.slice()));
  const n=Math.min(visRun(a),CAP-G.cols[b].length);
  const srcT=board.children[a].querySelectorAll('.tier'),dstT=board.children[b].querySelectorAll('.tier');
  const lenA=G.cols[a].length,lenB=G.cols[b].length;
  const anims=[];
  for(let k=0;k<n;k++){
    const sEl=srcT[lenA-1-k].querySelector('.dp');const r1=sEl.getBoundingClientRect();
    const tr=dstT[lenB+k].getBoundingClientRect();
    const tx=tr.left+tr.width*.04, ty=tr.bottom-tr.height*.09-r1.height;
    const fl=document.createElement('div');fl.className='fly';fl.innerHTML=sEl.innerHTML;
    Object.assign(fl.style,{left:r1.left+'px',top:r1.top+'px',width:r1.width+'px',height:r1.height+'px'});
    document.body.appendChild(fl);sEl.style.visibility='hidden';
    const dx=tx-r1.left,dy=ty-r1.top,peak=Math.min(0,dy)-40;
    const dur=300+k*60;
    const an=fl.animate([{transform:'translate(0,0)'},{transform:`translate(${dx*.5}px,${peak}px) rotate(${dx>0?8:-8}deg)`,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(1.12,.86)`,offset:.9},{transform:`translate(${dx}px,${dy}px)`}],{duration:dur,easing:'ease-in-out',fill:'forwards'});
    anims.push(an.finished.then(()=>{sfx.plop(k)}).catch(()=>{}).then(()=>fl));

    for(let k=0;k<n;k++)G.cols[b].push(G.cols[a].pop());G.hid[a]=Math.min(G.hid[a]||0,Math.max(0,G.cols[a].length-1));G.sel=null;

  });
}

function roll(minR){
  const r=Math.random();let rar=r<.06?2:r<.28?1:0;
  const owned=Object.keys(S.coll).length;
  if(owned===0)rar=0;
  rar=Math.max(rar,minR||0);
  if(SEASON&&owned>0&&Math.random()<.3){const ny=CHARS.filter(c=>c.ny&&c.r>=(minR||0));const f=ny.filter(c=>!S.coll[c.id]);const src=f.length?f:ny;return src[Math.floor(Math.random()*src.length)]}
  const pool=CHARS.filter(c=>c.r===rar&&!c.ny);
  // first-time players get something new more often
  const fresh=pool.filter(c=>!S.coll[c.id]);
  if(fresh.length&&Math.random()<.6)return fresh[Math.floor(Math.random()*fresh.length)];
  return pool[Math.floor(Math.random()*pool.length)];
}

  x.save();x.translate(W/2,H*.43);x.fillStyle=ray;for(let i=0;i<18;i++){x.rotate(Math.PI*2/18);x.beginPath();x.moveTo(0,0);x.lineTo(-60,-760);x.lineTo(60,-760);x.closePath();x.fill()}x.restore();
  if(SEASON){x.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<70;i++){x.beginPath();x.arc(Math.random()*W,Math.random()*H,2+Math.random()*5,0,7);x.fill()}}
  const im=await svgImg(dumpling(ch.col,ch.face,ch.acc).replace('<svg ','<svg width="700" height="728" '));
  x.drawImage(im,W/2-350,H*.43-400,700,728);
  try{await document.fonts.load('800 80px Unbounded');await document.fonts.load('800 40px Nunito')}catch(e){}
  x.textAlign='center';x.fillStyle='#9fc0b8';x.font='800 44px Nunito, sans-serif';x.fillText(T('cardTop'),W/2,120);
  const rc=ch.r===2?'#f3c24b':ch.r===1?'#6fd6c8':'#9fc0b8';x.font='800 34px Nunito, sans-serif';
  const rt=T('rarity')[ch.r].toUpperCase();const rw=x.measureText(rt).width+60;x.strokeStyle=rc;x.lineWidth=4;x.beginPath();x.roundRect(W/2-rw/2,H-370,rw,62,31);x.stroke();x.fillStyle=rc;x.fillText(rt,W/2,H-327);
  let fs=86;x.font=`800 ${fs}px Unbounded, sans-serif`;while(x.measureText(cname(ch)).width>W-120&&fs>40){fs-=4;x.font=`800 ${fs}px Unbounded, sans-serif`}
  x.fillStyle='#fff8ee';x.fillText(cname(ch),W/2,H-200);
  x.fillStyle='#efc988';x.font='800 50px Unbounded, sans-serif';x.fillText(T('brand'),W/2,H-95);
  x.fillStyle='#9fc0b8';x.font='700 32px Nunito, sans-serif';x.fillText(T('cardBottom'),W/2,H-48);
  return cv;
}
async function share(ch,fromWin,fromAlbum){
  ensureAC();goal('share',{hero:ch.id});let cv;try{cv=await makeCard(ch)}catch(e){toast('Error');return}
  const url=cv.toDataURL('image/png');
  try{
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const file=new File([blob],'pelmennaya-'+ch.id+'.png',{type:'image/png'});
    if(!P.noNativeShare&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:T('shareText')(cname(ch))});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const touch=matchMedia('(pointer:coarse)').matches;
  openOv(`<h2>${T('shareT')}</h2><img class="share-img" src="${url}" alt="${cname(ch)}"><p style="margin-top:10px">${touch?T('shareHint'):T('shareHintDesk')}</p>
    ${P.shareLink?`<button class="big-btn" id="shTg">${T('shareTg')}</button>`:''}
    <button class="ghost-btn" id="shClose">${fromAlbum?T('albumT'):T('close')}</button>`);
  if(P.shareLink)$('shTg').onclick=()=>P.shareLink(T('shareText')(cname(ch)));
  $('shClose').onclick=()=>{if(fromAlbum)album(fromWin);else{closeOv();if(fromWin)nextLevel()}};
}

board.addEventListener('click',e=>{const c=e.target.closest('.col');if(c)tap(+c.dataset.i)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('owned')){e.preventDefault();e.target.click()}});
board.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('.col');if(c){e.preventDefault();tap(+c.dataset.i)}}});
$('btnUndo').onclick=undo;$('btnHint').onclick=hint;$('lvlBtn').onclick=()=>{if(G.busy)return;levels()};$('btnExtra').onclick=extra;$('btnShake').onclick=shuffleBoard;$('btnAlbum').onclick=()=>{ensureAC();album(false)};
$('btnSound').onclick=()=>{S.muted=!S.muted;save();ensureAC();hud();if(!S.muted)sfx.pick()};
$('coinsBtn').onclick=()=>{if(G.busy)return;ensureAC();sfx.pick();shop()};

$('ov').addEventListener('click',e=>{if(e.target.id==='ov'&&document.getElementById('closeAlbum'))closeOv()});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(layout,80)});
addEventListener('contextmenu',e=>{if(!(e.target.classList&&(e.target.classList.contains('share-img')||e.target.classList.contains('rate-txt'))))e.preventDefault()});

function start(data){
  load();
  setLang((()=>{try{return new URLSearchParams(location.search).get('lang')}catch(e){}})()||P.lang||navigator.language);applyI18n();
  if(SEASON){const gl=$('garland');gl.hidden=false;const cs=['#e85a3c','#f3c24b','#6fd6c8','#a596f2'];gl.innerHTML=Array.from({length:22},(_,i)=>`<i style="--c:${cs[i%4]};animation-delay:${(i%4)*.4}s"></i>`).join('');
    const sn=$('snow');sn.hidden=false;sn.innerHTML=Array.from({length:34},()=>{const z=2+Math.random()*4;return `<i style="left:${Math.random()*100}%;width:${z}px;height:${z}px;--dx:${(Math.random()*60-30).toFixed(0)}px;animation-duration:${(7+Math.random()*8).toFixed(1)}s;animation-delay:-${(Math.random()*15).toFixed(1)}s"></i>`}).join('');}
  if(P.cloud&&typeof P.cloud==='object'&&P.cloud.level&&P.cloud.level>=S.level)S=Object.assign(S,P.cloud);
  if(data&&data.S)S=Object.assign(S,data.S);
  applySkin();
  if(data&&data.cols){G.cols=data.cols;startLevel(true)}else startLevel();
  window.__pel={S,G,solve,shortest,genLevel,tap,startLevel,startDaily,shop,wheel,achSheet,shuffleBoard,levels,playLevel};
  try{P.ready&&P.ready()}catch(e){}
  goal('game_start',{level:S.level});
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({S,cols:G.cols}))}catch(e){}}
const hot=window.claude&&window.claude.hot;
const boot=()=>{if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{})};
if(P.init){Promise.race([P.init(),new Promise(r=>setTimeout(r,4000))]).catch(()=>{}).then(boot)}else boot();
})();
